name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - name: Make docs file names safe for URLs
        # zensical crashes on a file or folder name that has one of
        # these characters: " < > \ ^ ` { | }  ("URL reference is a
        # valid IRI"). The Obsidian publisher can make such a name from
        # a note title. This step removes the characters in the runner
        # only, so one bad name cannot stop the deploy of the site.
        run: |
          python3 - <<'PY'
          import os, re
          bad = re.compile(r'["<>\\^`{|}]')
          for root, dirs, files in os.walk("docs", topdown=True):
              for group in (dirs, files):
                  for i, name in enumerate(group):
                      if not bad.search(name):
                          continue
                      new = bad.sub("", name)
                      src, dst = os.path.join(root, name), os.path.join(root, new)
                      if os.path.exists(dst):
                          print(f"::warning::Not renamed, {dst} exists: {src}")
                          continue
                      os.rename(src, dst)
                      group[i] = new
                      print(f"::warning::Renamed for the build: {src} -> {dst}")
          PY
      - run: zensical build --clean
      - name: Cache-bust custom assets
        # extra.css/extra.js (zensical's extra_css/extra_javascript) are
        # emitted with plain, unversioned filenames — unlike the theme's
        # own bundled CSS, which gets a content hash baked into its name.
        # Browsers then keep serving a stale copy after a deploy with no
        # way to know it changed. Stamping every reference with the
        # commit SHA forces a fresh fetch on every push, automatically.
        run: |
          SHA=$(git rev-parse --short HEAD)
          grep -rlZ -e 'stylesheets/extra\.css"' -e 'javascripts/extra\.js"' site --include='*.html' \
            | xargs -0 -r sed -i -E \
              -e "s#(stylesheets/extra\.css)\"#\1?v=${SHA}\"#g" \
              -e "s#(javascripts/extra\.js)\"#\1?v=${SHA}\"#g"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
