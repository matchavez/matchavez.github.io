# ----------------------------------------------------------------
# Zensical configuration
# Docs: https://zensical.org/docs/setup/basics/
# ----------------------------------------------------------------

[project]
site_name = "MatChavez.com"
site_url = "https://matchavez.com/"
site_description = "Mat Chavez's personal site: an AI blog, golf results and gear, small Mac apps, and favourite quotes."
site_author = "Mat Chavez"
repo_url = "https://github.com/matchavez/matchavez.github.io"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js", "javascripts/statcounter.js"]

# ----------------------------------------------------------------
# NAV PAGE TREE
# ----------------------------------------------------------------
nav = [
  { "Welcome" = "index.md" },
  { "AI Blog" = [
    { "All posts" = "ai.md" },
    { "Building an Offline Second Opinion With Llama 3.1" = "ai/Building an Offline Second Opinion With Llama 3.1.md" },
    { "Teaching Myself to Keep My Own Notes Honest" = "ai/Teaching Myself to Keep My Own Notes Honest.md" },
    { "Getting a Broken Zotero Tab Out of Word" = "ai/Getting a Broken Zotero Tab Out of Word.md" },
    { "When a Tool Says “Written” and the File Says Otherwise" = "When a Tool Says “Written” and the File Says Otherwise.md" },
    { "A Test That Passed for the Wrong Reason" = "ai/A Test That Passed for the Wrong Reason.md" },
  ] },
  { "Projects" = [
    # { "Stream Test" = "projects/streaming.md" },
    { "Tellyhoova" = "projects/Tellyhoova.md" },
    { "Dumptruck" = "projects/Dumptruck.md" },
  ] },
  # { "Notetaking" = [
  #   { "All about notes" = "notetaking.md" },
  #   { "Winner First" = "notetaking/winner_first.md" },
  #   { "Applications" = "notetaking/Notetaking Applications.md" },
  #   { "GFM vs. JSON" = "notetaking/GFM vs. JSON.md" },
  # ] },
  { "Favourite Quotes" = "Favourite Quotes.md" },
  { "Golf" = [
    { "Tournaments" = "golf/Golf Tournaments.md" },
    { "Equipment" = "golf/Golf Equipment.md" },
    # { "Chch Info" = "golf/Christchurch Golf Information.md" },
  ] },
  # { "Apple" = [
  #   { "Fixes" = "apple/fixes.md" },
  #   { "Commands" = "apple/commands.md" },
  # ] },
  { "Hockey" = "https://matchavez.com/hockey/" },
  { "Test Pages" = [
    { "Typography" = "Typography.md" },
    # { "Linux Shortcuts" = "linux_shortcuts.md" },
  ] },
]

# ----------------------------------------------------------------
# THEME
# ----------------------------------------------------------------
[project.theme]
variant = "modern" # pin the current default so future default changes can't restyle the site
custom_dir = "overrides"
favicon = "images/favicon.png"
language = "en"
font = false
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "content.action.edit",
  "navigation.footer", # previous / next links at the foot of each page
]

# Palette toggle for light mode
[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Footer links (icons in the green footer sign)
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matchavez"
name = "GitHub"

[[project.extra.social]]
icon = "lucide/rss"
link = "https://matchavez.com/feed_rss_created.xml"
name = "AI Blog RSS feed"

[[project.extra.social]]
icon = "lucide/tv"
link = "https://matchavez.com/hockey/"
name = "Hockey"

# ----------------------------------------------------------------
# MARKDOWN EXTENSIONS
# ----------------------------------------------------------------
[project.markdown_extensions.pymdownx.snippets]
base_path = "docs"
check_paths = true

[project.markdown_extensions.admonition]
[project.markdown_extensions.abbr]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"

[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.critic]
[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true
user = "matchavez"
repo = "matchavez.github.io"

[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true # the only tab style Zensical supports

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]

# ----------------------------------------------------------------
# PLUGINS
# ----------------------------------------------------------------
# RSS feed of the AI Blog: /feed_rss_created.xml (newest first).
# Dates come from the date: line in each post's front matter.
[project.plugins.rss]
match_path = '^(ai/.+|When a Tool Says.+)\.md$'
feed_title = "MatChavez.com AI Blog"
feed_description = "Claude, writing about its own work and mistakes on this site."
abstract_chars_count = 300
json_feed_enabled = false

[project.plugins.rss.date_from_meta]
as_creation = "date"
as_update = "date"
datetime_format = "%Y-%m-%d"
default_timezone = "Pacific/Auckland"

# Old page address sends visitors to the new one. Keep this list short:
# the build stops if a redirect's old file comes back as a real page
# (Enveloppe can recreate a file from a note title), and a redirect for
# a change of letter case only would replace the real page on a Mac.
[project.plugins.redirects.redirect_maps]
"favourite_quotes.md" = "Favourite Quotes.md"
